  split: validation sequence partition unresolved
  detector: historical grounding detector output; detector artifact is not redistributed
  coordinate_convention: detector boxes transformed to KITTI lidar for association and to camera coordinates for official output
  history_policy: three prior observations ordered oldest-to-newest
  geometry_definition: x/10,y/10,z/10,length,width,height,volume,yaw,detection_score
