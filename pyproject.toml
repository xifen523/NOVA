[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-association"
version = "0.1.0"
description = "Next-step open-vocabulary autoregression for 3D multi-object tracking"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.23,<2",
  "scipy>=1.9,<2",
  "PyYAML>=6,<7",
  "safetensors>=0.4,<1",
  "torch>=1.12,<3",
]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
model = [
  "transformers>=4.37,<5",
  "peft>=0.8,<1",
  "tokenizers>=0.15,<1",
]
test = ["pytest>=7,<9", "packaging>=23,<26"]
dev = ["pytest>=7,<9", "packaging>=23,<26", "build>=1,<2"]
visualization = ["matplotlib", "Pillow", "opencv-python"]
nuscenes = ["nuscenes-devkit", "pyquaternion", "shapely"]

[project.scripts]
nova-prepare = "nova.cli.prepare:main"
nova-train = "nova.cli.train:main"
nova-infer = "nova.cli.infer:main"
nova-summarize = "nova.cli.summarize:main"
nova-evaluate = "nova.cli.evaluate:main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
pythonpath = ["."]
